<div class="stundensatz-list" [class.is-disabled]="disabled">
  <div class="stundensatz-rows">
    <div
      *ngFor="let entry of entries; let i = index"
      class="stundensatz-row"
      [class.selected]="selectedIndex === i"
      (click)="selectRow(i)"
    >
      <span class="entry-date">{{ entry.aktivierungsdatum }}</span>
      <span class="entry-satz">{{ entry.stundensatz | number : '1.2-2' }}</span>
    </div>
    <div class="empty-hint" *ngIf="!entries.length">
      Keine Stundensatz-Änderungen vorhanden.
    </div>
  </div>
</div>
