<div class="container fade-in">
  <div class="header">
    <div class="left-section">
      <!-- <mat-icon class="menue">menu</mat-icon>
      <button mat-raised-button class="neu-button" >
        <mat-icon>widgets</mat-icon>
        Neu
      </button> -->
    </div>
    <div class="center-section">
      <span class="title">Zivildiener</span>
    </div>
    <div class="right-section">
      <div class="checkbox-container">
        <mat-checkbox
          class="inkle-inactive"
          [(ngModel)]="showInactive"
          (change)="onCheckboxChange()"
        >
       <span class="checkbox-label">  inkl. inaktive</span>
        </mat-checkbox>
      </div>
      <div class="search-container">
        <input
          type="text"
          placeholder="Suche"
          [(ngModel)]="searchTerm"
          (input)="filterdata()"
          class="search-input"
        />
        <mat-icon class="search-icon">search</mat-icon>
      </div>
    </div>
  </div>
  <div *ngIf="errorMessage && !isLoading" class="error-container">
    <mat-icon>error_outline</mat-icon>
    <span>{{ errorMessage }}</span>
  </div>
  <div class="table-container" *ngIf="!isLoading && !errorMessage">
    <table
      mat-table
      [dataSource]="dataSource"
      class="mat-elevation-z8"
      *ngIf="dataSource?.data?.length">

      <ng-container matColumnDef="icon"  >
        <th mat-header-cell *matHeaderCellDef class="first-column"
            (click)="toggleSort('aktiv')">
          <div class="sort-header">
            <span class="mdi sort-icon" [ngClass]="getSortIcon('aktiv')" *ngIf="activeSortColumn === 'aktiv'"></span>
          </div>
        </th>
        <td mat-cell *matCellDef="let element"  class="first-column" >
          <i
            class="mdi status-icon"
            [class.mdi-check]="element.aktiv"
            [class.mdi-close]="!element.aktiv"
            [class.status-icon-active]="element.aktiv"
            [class.status-icon-inactive]="!element.aktiv"
            aria-hidden="true"
          ></i>
        </td>
      </ng-container>




      <ng-container matColumnDef="nachname">
        <th mat-header-cell *matHeaderCellDef (click)="toggleSort('nachname')">
          <div class="sort-header">
            Familienname
            <span class="mdi sort-icon" [ngClass]="getSortIcon('nachname')" *ngIf="activeSortColumn === 'nachname'"></span>
          </div>
        </th>
        <td mat-cell *matCellDef="let element">{{ element.nachname || "" }}</td>
      </ng-container>

      <ng-container matColumnDef="vorname">
        <th mat-header-cell *matHeaderCellDef (click)="toggleSort('vorname')">
          <div class="sort-header">
            Vorname
            <span class="mdi sort-icon" [ngClass]="getSortIcon('vorname')" *ngIf="activeSortColumn === 'vorname'"></span>
          </div>
        </th>
        <td mat-cell *matCellDef="let element">{{ element.vorname || "" }}</td>
      </ng-container>

      <ng-container matColumnDef="mitarbeiterart">
        <th mat-header-cell *matHeaderCellDef (click)="toggleSort('mitarbeiterart')">
          <div class="sort-header">
            Mitarbeiterart
            <span class="mdi sort-icon" [ngClass]="getSortIcon('mitarbeiterart')" *ngIf="activeSortColumn === 'mitarbeiterart'"></span>
          </div>
        </th>
        <td mat-cell *matCellDef="let element">{{ element.mitarbeiterart || "" }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [class.inactive-row]="!row.aktiv"
        [class.active-row]="row.aktiv"
        [class.selected-row]="selectedRowId === row.id"
        [attr.data-row-id]="row.id"
        (click)="selectRow(row)"
        (dblclick)="goToDetails(row)"
        class="list-row"
      ></tr>
    </table>
    <div *ngIf="!dataSource?.data?.length && !isLoading" class="empty-state">
      <mat-icon>info_outline</mat-icon>
      <span>Keine Daten gefunden</span>
    </div>
  </div>
</div>
